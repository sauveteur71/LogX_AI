<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogX AI — Bande</title>
<link rel="icon" href="/logx_icon.svg">
<!--
  SURVEILLANCE D'UNE BANDE — fenêtre détachable, une par bande.

  DEMANDE UTILISATEUR : « je veux surveiller simultanément toutes les bandes en
  même temps ; je peux en ouvrir autant que je veux pour voir ce qu'il se
  passe ». C'est ce que fait Logger32 avec ses fenêtres multiples.

  POURQUOI C'EST FACILE ICI ET DIFFICILE AILLEURS : ce sont des pages web. On
  en ouvre autant qu'on veut, on les répartit sur plusieurs écrans, et rien
  n'empêche d'en mettre une sur un second PC ou une tablette — il suffit de
  l'adresse du serveur. Un logiciel de bureau devrait gérer lui-même le
  multi-fenêtre et ne sortirait jamais de sa machine.

  LECTURE SEULE, à dessein, sauf le QSY : cette fenêtre sert à SURVEILLER
  pendant qu'on trafique ailleurs. Y mettre la saisie dupliquerait le logbook
  et créerait deux endroits où enregistrer un QSO.

  Une seule requête réseau pour toutes les fenêtres ouvertes : chacune lit
  /data/spots_ranked (déjà servi depuis les caches du serveur, sans appel
  extérieur) et filtre SA bande. Dix fenêtres ne font donc pas dix connexions
  au cluster.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap');
:root{--bg:#17181A;--bg2:#1D1F22;--bg3:#25272B;--border:#464950;
  --accent:#E8964A;--accent2:#E8964A;--accent-rgb:232,150,74;--green:#00FF88;--yellow:#FFD60A;
  --red:#FF2D55;--purple:#BF5AF2;--text:#EDF0FA;--muted:#8792B5;
  --mono:'Share Tech Mono',monospace;--font-display:'Fraunces',serif;}
body.day-mode{--bg:#EDEAE0;--bg2:#F8F6EF;--bg3:#E3DED0;--border:#B8B096;
  --accent:#8B4F1F;--accent2:#8B4F1F;--accent-rgb:139,79,31;--green:#007030;--yellow:#7A5A00;
  --red:#CC0030;--purple:#8040B0;--text:#232320;--muted:#665F55;}
body.day-mode header{background:linear-gradient(90deg,var(--bg3),var(--bg2),var(--bg3))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:linear-gradient(90deg,var(--bg),var(--bg2),var(--bg));border-bottom:2px solid var(--border);flex-shrink:0}
.bande{font-size:20px;font-family:var(--font-display);font-weight:900;color:var(--accent);letter-spacing:.2px}
.compte{font-size:12px;color:var(--muted)}
.clock{margin-left:auto;font-size:13px;color:var(--muted)}
.wrap{flex:1;overflow-y:auto;display:flex}
/* RÉGLETTE DE FRÉQUENCE — la différence entre « qui est là » et « OÙ ».
   Une liste dit qui trafique ; une échelle montre où l'activité se concentre
   et surtout OÙ IL RESTE UN TROU pour appeler. C'est l'information qu'une
   liste ne peut pas donner, et c'est ce que font les fenêtres de Logger32. */
.regle{position:relative;width:96px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg2)}
.seg{position:absolute;left:0;right:0}
.seg-cw{background:rgba(255,214,10,.13)}
.seg-digital{background:rgba(191,90,242,.13)}
.seg-phone{background:rgba(0,212,255,.10)}
.seg-lbl{position:absolute;left:3px;font-size:9px;color:var(--muted);letter-spacing:1px}
.tick{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.08)}
.tick span{position:absolute;right:3px;top:-6px;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.pin{position:absolute;right:2px;height:10px;padding:0 3px;border-radius:2px;font-size:9px;
     line-height:10px;white-space:nowrap;cursor:pointer;font-weight:700}
.pin-besoin{background:var(--red);color:#fff}
.pin-lotw{background:var(--green);color:#04120a}
body.day-mode .pin-lotw{color:#eef7e9}
.pin-autre{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
.liste-col{flex:1;overflow-y:auto;min-width:0}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:auto 82px 1fr auto;gap:8px;align-items:baseline;
     padding:5px 12px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;cursor:pointer}
.row:hover{background:var(--bg3)}
.call{font-weight:800;letter-spacing:.5px}
.freq{color:var(--accent2);font-variant-numeric:tabular-nums}
.pays{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;padding:1px 5px;border-radius:4px;white-space:nowrap}
/* Utilisateur LoTW : le QSO pourra être confirmé, donc compter pour le DXCC. */
.lotw{background:rgba(0,255,136,.14);color:var(--green)}
/* Pas sur LoTW : le contact ne sera JAMAIS confirmé. Volontairement discret —
   c'est une information, pas une interdiction de trafiquer. */
.nolotw{color:var(--muted);opacity:.65}
/* Besoin DXCC non confirmé LoTW : ce qui fait avancer le compteur. */
.besoin{background:rgba(255,45,85,.16);color:var(--red);font-weight:700}
.done{opacity:.35;text-decoration:line-through}
footer{flex-shrink:0;padding:5px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:14px}

/* Focus clavier visible générique -- audit accessibilité 09/08/2026 : seuls
   les champs de saisie avaient un style :focus soigné, les boutons/liens
   retombaient sur l'anneau par défaut du navigateur (incohérent avec le
   thème graphite&cuivre). Purement additif, ne retire aucun style existant. */
button:focus-visible,.btn:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
</style>
</head>
<body data-rc-no-lang-select>
<header>
  <!-- rc-i18n-live : ces trois-là ne contiennent QUE des données réécrites en
       boucle (fréquence de bande, compteur, horloge à la seconde). Sans cette
       classe, chaque tick déclencherait une passe de traduction complète sur
       une page qui, en expédition, reste ouverte des jours durant. -->
  <span class="bande rc-i18n-live" id="titreBande">—</span>
  <span class="compte rc-i18n-live" id="compte"></span>
  <span class="clock rc-i18n-live" id="clock">--:--:--</span>
</header>
<div class="wrap">
  <!-- L'échelle est reconstruite à chaque rafraîchissement et ne contient que
       des fréquences ; son infobulle, elle, est bien traduite : translateAttr
       lit les attributs par querySelectorAll, sans passer par le TreeWalker
       que rc-i18n-live exclut. -->
  <div class="regle rc-i18n-live" id="regle" title="Échelle de fréquence : jaune = CW, violet = numérique, bleu = phonie. Les trous sont les fréquences libres."></div>
  <div class="liste-col"><div id="liste"><div class="empty">Chargement…</div></div></div>
</div>
<footer>
  <span>clic = QSY</span>
  <span class="lotw tag">LoTW</span>
  <span class="besoin tag">besoin DXCC</span>
</footer>
<!-- Moteur de traduction. Cette page ne le chargeait PAS : elle restait
     intégralement en français quelle que soit la langue choisie, y compris son
     titre d'onglet, alors que le dictionnaire contenait déjà ses libellés. -->
<script src="logx_i18n.js"></script>
<script>
// Thème jour/nuit : ces pages détachées n'incluent pas logx_statusbar.js, le
// réglage est donc relu ici depuis localStorage puis, à défaut, depuis la
// config serveur — sans quoi une fenêtre ouverte en plein jour repasserait en
// mode nuit alors que le logbook est en clair.
if(localStorage.getItem('rc_theme') === 'day') document.body.classList.add('day-mode');
if(localStorage.getItem('rc_theme') === null){
  fetch('/config').then(r=>r.ok?r.json():null).then(c=>{
    if(c && c.ui_theme && localStorage.getItem('rc_theme') === null){
      localStorage.setItem('rc_theme', c.ui_theme);
      document.body.classList.toggle('day-mode', c.ui_theme === 'day');
    }
  }).catch(()=>{});
}

(function(){
  // Raccourcis i18n (fournis par logx_i18n.js ; repli = identité si absent).
  // Tf remplace les trous {x} APRÈS traduction : indispensable dès qu'un texte
  // contient une valeur, puisque la phrase assemblée — « Aucun spot sur 14 MHz »
  // — ne peut être aucune clé de dictionnaire, elle change avec la bande.
  const T = s => (window.rcT ? window.rcT(s) : s);
  const Tf = (s, p) => (window.rcTf ? window.rcTf(s, p) : (function(){
    let o = s; for(const k in (p || {})) o = o.split('{' + k + '}').join(p[k]); return o;
  })());
  if(location.protocol === 'file:'){
    document.body.innerHTML = '<div class="empty">'
      + Tf('Ouvre via le serveur : {url}',
           {url: 'http://127.0.0.1:8080/logx_bande.html?band=14'}) + '</div>';
    return;
  }
  const params = new URLSearchParams(location.search);
  const bande = (params.get('band') || '14').trim();
  document.getElementById('titreBande').textContent = bande + ' MHz';
  document.title = 'LogX AI — ' + bande + ' MHz';

  const esc = v => String(v==null?'':v).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function horloge(){
    const d = new Date();
    document.getElementById('clock').textContent =
      String(d.getUTCHours()).padStart(2,'0') + ':' +
      String(d.getUTCMinutes()).padStart(2,'0') + ':' +
      String(d.getUTCSeconds()).padStart(2,'0') + ' UTC';
  }

  // QSY : passe par le serveur, donc marche depuis n'importe quel poste du
  // réseau — y compris une tablette posée à côté du transceiver.
  // Reçoit des kHz. /rig/qsy ne lit QUE freq_hz ou freq_khz : la version
  // précédente envoyait {freq:...}, jamais relu côté serveur, et le clic sur
  // une épingle ne faisait donc rien du tout — même radio allumée.
  async function qsy(khz, mode){
    const f = Number(khz);
    if(!f) return;
    try{
      await fetch('/rig/qsy', {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify({freq_khz: f, mode: mode || undefined})});
    }catch(e){ /* radio non pilotée : le clic reste sans effet, sans erreur */ }
  }

  function ligne(s){
    const besoin = s.lotw_need_ici;
    const classes = ['row'];
    if(s.already_done) classes.push('done');
    const tags = [];
    if(besoin) tags.push('<span class="tag besoin">DXCC</span>');
    if(s.lotw === true) tags.push('<span class="tag lotw">LoTW</span>');
    else if(s.lotw === false) tags.push('<span class="tag nolotw">' + T('pas LoTW') + '</span>');
    // Le serveur envoie des kHz (freq_en_khz) ; on affiche des MHz, seule
    // écriture qu'un opérateur lit d'un coup d'oeil. data-freq garde les kHz,
    // c'est ce que /rig/qsy attend.
    const mhz = (parseFloat(s.freq) || 0) / 1000;
    return `<div class="${classes.join(' ')}" data-freq="${esc(s.freq||'')}" data-mode="${esc(s.mode||'')}">
      <span class="call">${s.new_mult && !s.already_done ? '★ ' : ''}${esc(s.call)}</span>
      <span class="freq">${mhz ? mhz.toFixed(3) : ''}</span>
      <span class="pays">${esc(s.dx_country || s.info || '')}</span>
      <span>${tags.join(' ')}</span>
    </div>`;
  }

  // ── Réglette de fréquence ────────────────────────────────────────────────
  // Les bornes et le découpage CW/numérique/phonie viennent du serveur
  // (logx_awards.segments_bande), qui les dérive de la MÊME table que le mode
  // déduit de la fréquence : une réglette et une alerte ne peuvent donc jamais
  // désigner des segments différents.
  let _plage = null;   // {lo, hi, segments:[...]}

  async function chargerPlage(){
    try{
      const r = await fetch('/data/bande_segments?band=' + encodeURIComponent(bande));
      if(!r.ok) return;
      const d = await r.json();
      if(d && d.segments && d.segments.length) _plage = d;
    }catch(e){ /* la fenêtre reste utilisable en liste seule */ }
  }

  function pct(mhz){
    // Position verticale : le HAUT de la réglette est le BAS de bande, comme
    // sur un récepteur qu'on remonte en fréquence.
    if(!_plage) return null;
    const p = (mhz - _plage.lo) / (_plage.hi - _plage.lo);
    return (p < 0 || p > 1) ? null : p * 100;
  }

  function dessinerRegle(spots){
    const el = document.getElementById('regle');
    if(!el) return;
    if(!_plage){ el.innerHTML = ''; el.style.display = 'none'; return; }
    el.style.display = '';
    const bouts = [];
    for(const s of _plage.segments){
      const h = pct(s.hi) - pct(s.lo);
      bouts.push(`<div class="seg seg-${s.cat.toLowerCase()}" style="top:${pct(s.lo)}%;height:${h}%"></div>`);
      // Étiquette seulement si le segment est assez haut pour la contenir —
      // sinon les libellés se chevauchent et deviennent illisibles.
      if(h > 7) bouts.push(`<div class="seg-lbl" style="top:${pct(s.lo) + 0.6}%">${s.cat === 'DIGITAL' ? 'DIGI' : s.cat}</div>`);
    }
    // Graduations : une tous les 100 kHz sur les bandes étroites, sinon une
    // par tranche régulière — dix repères suffisent à se situer.
    const etendue = _plage.hi - _plage.lo;
    const pas = etendue <= 0.2 ? 0.05 : etendue <= 0.6 ? 0.1 : etendue <= 2 ? 0.5 : 1;
    for(let f = Math.ceil(_plage.lo / pas) * pas; f < _plage.hi; f += pas){
      const p = pct(f);
      if(p === null) continue;
      bouts.push(`<div class="tick" style="top:${p}%"><span>${f.toFixed(etendue <= 0.6 ? 3 : 1)}</span></div>`);
    }
    for(const s of (spots || [])){
      // _plage vient de /data/bande_segments, en MHz ; les spots arrivent en
      // kHz. Sans cette conversion, pct() rendait null pour TOUS les spots et
      // la réglette restait vide en permanence.
      const smhz = (parseFloat(s.freq) || 0) / 1000;
      const p = pct(smhz);
      if(p === null) continue;
      const cls = s.lotw_need_ici ? 'pin-besoin' : (s.lotw === true ? 'pin-lotw' : 'pin-autre');
      bouts.push(`<div class="pin ${cls}" style="top:${p}%" data-freq="${esc(s.freq)}" data-mode="${esc(s.mode||'')}"
                   title="${esc(s.call)} · ${smhz.toFixed(3)} MHz">${esc(s.call)}</div>`);
    }
    el.innerHTML = bouts.join('');
    el.querySelectorAll('.pin').forEach(p => { p.onclick = () => qsy(p.dataset.freq, p.dataset.mode); });
  }

  async function tick(){
    horloge();
    try{
      const r = await fetch('/data/spots_ranked');
      if(!r.ok) return;
      const d = await r.json();
      // Filtrage sur NOTRE bande uniquement : c'est tout l'intérêt d'ouvrir
      // une fenêtre par bande plutôt qu'une liste unique où tout se mélange.
      const spots = (d.spots || []).filter(s => String(s.band) === bande);
      document.getElementById('compte').textContent =
        spots.length ? spots.length + ' spot' + (spots.length>1?'s':'') : '';
      const liste = document.getElementById('liste');
      if(!spots.length){
        liste.innerHTML = '<div class="empty">'
          + Tf('Aucun spot sur {bande} MHz', {bande: esc(bande)}) + '</div>';
        // La réglette reste dessinée : bande vide = bande ENTIÈREMENT libre,
        // c'est une information, pas une absence d'information.
        dessinerRegle([]);
        return;
      }
      liste.innerHTML = spots.map(ligne).join('');
      liste.querySelectorAll('.row').forEach(el => {
        el.onclick = () => qsy(el.dataset.freq, el.dataset.mode);
      });
      dessinerRegle(spots);
    }catch(e){ /* serveur injoignable : on garde l'affichage précédent */ }
  }

  chargerPlage().then(tick);
  setInterval(tick, 15000);
  setInterval(horloge, 1000);
})();
</script>
</body>
</html>
