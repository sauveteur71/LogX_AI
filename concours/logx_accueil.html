<!--
  PAGE D'ACCUEIL PAR ACTIVITÉ — chantier « axe = activité, pas mode déclaré »
  (CLAUDE.md, décision F4GLD du 19/08/2026 suite à un échange avec Didier,
  détaillée en pratique le 22/08/2026). Nouvelle porte d'entrée de l'app
  (concours/logx_http.py, routage racine "/") : l'opérateur choisit CE QU'IL
  FAIT (LOG V/UHF, LOG normal...) plutôt que de déclarer un niveau
  simple/expert. Un clic pose localStorage.logx_activity puis redirige --
  les visites suivantes sautent directement la grille (résumé en un geste,
  « ne pas rallonger le chemin quotidien »).

  HONNÊTETÉ DE PÉRIMÈTRE (22/08/2026) : seule LOG V/UHF a un vrai filtrage
  (bandes/concours) à ce stade -- doctrine « une activité de bout en bout
  avant les 18 autres ». Les autres tuiles restent pleinement fonctionnelles :
  elles routent vers CONFIG/LOGBOOK SANS filtre supplémentaire, c'est-à-dire
  exactement le comportement actuel de l'app (LOG normal/LOG Concours EN SONT
  déjà l'usage principal). Aucune tuile n'est un leurre.

  Le carnet reste UNIQUE et chronologique quelle que soit l'activité choisie
  -- l'activité est une VUE, jamais un second carnet.
-->
<link rel="stylesheet" href="logx_theme.css">
<link rel="stylesheet" href="logx_chasse_panneaux.css">
<script src="logx_theme_guard.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap');


body.day-mode header{background:linear-gradient(90deg,var(--bg3),var(--bg2),var(--bg3))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(90deg,var(--bg),var(--bg2),var(--bg));border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo-badge{background:#EEF0F8;border-radius:8px;padding:3px 8px;display:inline-flex;align-items:center;line-height:0}
.logo-badge img{height:20px;display:block}
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-suffix{font-family:var(--font-mono);font-size:18px;color:var(--accent);letter-spacing:1px}
.config-link{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:.5px}
.config-link:hover{color:var(--text)}

/* Barre de navigation principale — copiée verbatim des 13 autres pages
   (fusion incr. 5a, 11/09/2026 : logx_accueil.html en était dépourvue à
   dessein — page d'accueil minimaliste — mais CHASSE doit pouvoir y
   rediriger sans priver l'opérateur de la nav). .nav-tools et .rcb-* sont
   déjà mutualisés dans logx_theme.css : seul .app-nav reste local partout. */
.app-nav{display:flex;align-items:stretch;background:var(--bg2);border-bottom:2px solid var(--border);flex-shrink:0}
.app-nav a{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:2px;color:var(--muted);text-decoration:none;padding:10px 22px;border-right:1px solid var(--border);display:flex;align-items:center;gap:7px;transition:all .15s;border-bottom:3px solid transparent;margin-bottom:-2px}
.app-nav a:hover{color:var(--text);background:var(--bg3)}
.app-nav a.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg3)}
/* Repli défensif (même motif que les 13 pages) : .expert-only est injecté par
   logx_statusbar.js au chargement -- ce doublon statique évite un flash de
   contenu avancé si ce script est lent/bloqué. */
body.simple-mode .expert-only{display:none!important}
.app-nav a svg,.nav-ico svg{width:15px;height:15px;flex-shrink:0}

/* align-items:flex-start (pas center) : un centrage vertical avec overflow
   coupe le HAUT du contenu, hors d'atteinte du scroll, dès que la grille
   dépasse la hauteur de fenêtre (fenêtre courte, mobile, ou simplement plus
   d'activités ajoutées plus tard) -- trouvé en vérification navigateur
   réelle, pas supposé. */
.wrap{flex:1;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:30px 20px}
.intro{max-width:900px;width:100%}
.intro h1{font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--accent2);letter-spacing:.2px;margin-bottom:6px;text-align:center}
.intro p{color:var(--muted);font-size:14px;text-align:center;margin-bottom:28px}

.activity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.activity-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:18px 16px;
  cursor:pointer;transition:all .2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;
  font-family:inherit;color:inherit;width:100%}
.activity-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.activity-card svg{width:30px;height:30px;flex-shrink:0;color:var(--accent2)}
.activity-name{font-size:14.5px;font-weight:700;color:var(--text)}
.activity-hint{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.5px;line-height:1.4}
.activity-card.pilote{border-color:var(--accent2);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.35)}
.activity-card.pilote .activity-name{color:var(--accent2)}

.chargement{text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:13px;padding:60px 0}

/* Section « Mode SOTA/POTA cette session » (chasse/portable/les deux). */
#xotaRoleAccueil{margin-top:26px}
.xota-acc-h{font-family:var(--font-mono);font-size:13px;letter-spacing:1px;color:var(--muted);text-align:center;margin-bottom:12px}
.xota-acc-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:560px;margin:0 auto}
.xota-acc-tile{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;color:inherit;transition:all .18s}
.xota-acc-tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.xota-acc-tile.on{border-color:var(--accent2);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.35)}
.xota-acc-ico{font-size:26px;line-height:1}
.xota-acc-name{font-size:14px;font-weight:700;color:var(--text)}
.xota-acc-tile.on .xota-acc-name{color:var(--accent2)}
.xota-acc-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.3px;text-align:center}

button:focus-visible,.activity-card:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* ── BANDEAU DÉFILANT (ticker HUD) : composant .rcb-* MUTUALISÉ dans
   logx_theme.css (chargé via <link>), pour être réutilisable par d'autres
   pages (CHASSE…). Ne plus le redéclarer ici. ── */

/* ── COCKPIT « que puis-je faire maintenant » + bouton Reprendre (28/08) ── */
.reprise-wrap{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:20px}
.reprendre-btn{font-family:var(--font-mono);font-size:15px;font-weight:700;letter-spacing:1px;padding:11px 22px;border-radius:8px;border:1px solid var(--accent);background:rgba(var(--accent-rgb),.14);color:var(--accent);cursor:pointer}
.reprendre-btn:hover{background:rgba(var(--accent-rgb),.24)}
.reprise-changer{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-decoration:none}
.reprise-changer:hover{color:var(--text)}
.cockpit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px}
.ck-col{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.ck-col h2{font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:var(--muted);margin-bottom:8px;text-align:left}
.ck-opp{font-size:13px;color:var(--text);padding:3px 0}
.ck-opp span{color:var(--accent2)}
.ck-vide{font-size:12px;color:var(--muted)}
.ck-prog{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
.ck-prog b{color:var(--accent2);font-family:var(--font-mono)}
.ck-etat{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0;color:var(--text)}
.ck-dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.ck-dot[data-c="green"]{background:var(--green)}
.ck-dot[data-c="yellow"]{background:var(--yellow)}
.ck-dot[data-c="red"]{background:var(--red)}
.ck-dot[data-c="muted"]{background:var(--muted)}
</style>
</head>
