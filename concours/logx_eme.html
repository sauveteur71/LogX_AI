<script>
// Fonctions pures, testables hors DOM (py_mini_racer) -- voir
// concours/tests/test_eme_page.py. Isolées dans CE <script>, avant tout
// autre code, pour rester extractibles sans DOM.
function dopplerLabel(hz) {
  if (hz === null || hz === undefined) return '—';
  var s = hz > 0 ? '+' : '';
  return s + Math.round(hz) + ' Hz';
}
function formatDecode(d) {
  // "DL7APV  -24 dB  Q65  432.071" — compact, une ligne par station entendue.
  return [d.call, (d.snr >= 0 ? '+' : '') + d.snr + ' dB', d.mode,
          (d.freq_mhz || '').toString()].join('  ');
}
if (typeof window !== 'undefined') { window.dopplerLabel = dopplerLabel; window.formatDecode = formatDecode; }
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap');

body.day-mode header{background:linear-gradient(90deg,var(--bg3),var(--bg2),var(--bg3))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* Page « app » : nav et statusbar fixes, le contenu défile en interne */
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden}

header{background:linear-gradient(90deg,var(--bg),var(--bg2),var(--bg));border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo-badge{background:#EEF0F8;border-radius:8px;padding:3px 8px;display:inline-flex;align-items:center;line-height:0}
.logo-badge img{height:20px;display:block}
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-suffix{font-family:var(--font-mono);font-size:18px;color:var(--accent);letter-spacing:1px}
.app-nav{display:flex;align-items:stretch;background:var(--bg2);border-bottom:2px solid var(--border);flex-shrink:0}
.app-nav a{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:2px;color:var(--muted);text-decoration:none;padding:10px 22px;border-right:1px solid var(--border);display:flex;align-items:center;gap:7px;transition:all .15s;border-bottom:3px solid transparent;margin-bottom:-2px}
/* Repli défensif (audit intuitivité 13/08/2026) : .expert-only est normalement injecté par logx_statusbar.js au chargement -- ce doublon statique évite un flash de contenu avancé si ce script est lent/bloqué, même filet que les autres pages. */
body.simple-mode .expert-only{display:none!important}
.app-nav a:hover{color:var(--text);background:var(--bg3)}
.app-nav a.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg3)}
.app-nav a svg,.nav-ico svg{width:15px;height:15px;flex-shrink:0}

.container{max-width:1500px;margin:0 auto;padding:20px;flex:1;overflow-y:auto;min-height:0;width:100%}

/* ── Barre de contrôle (bande + correspondant) ─────────────────────────── */
.eme-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 18px;margin-bottom:16px}
.eme-field{display:flex;flex-direction:column;gap:4px}
.eme-field label{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--muted)}
.eme-field select,.eme-field input{font-family:var(--font-mono);font-size:14px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.eme-field select:focus,.eme-field input:focus{outline:none;border-color:var(--accent2)}

/* ── Bandeau transverter (dial CAT = FI) ───────────────────────────────── */
.eme-transverter-banner{display:none;align-items:center;gap:10px;background:rgba(var(--accent-rgb),.12);border:1px solid var(--accent2);border-radius:8px;padding:10px 16px;margin-bottom:16px;font-family:var(--font-mono);font-size:13px;color:var(--accent2)}
.eme-transverter-banner.show{display:flex}

/* ── Grille de panneaux ─────────────────────────────────────────────────── */
.eme-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"lune lune" "rig suivi" "decodes decodes";gap:16px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.panel-lune{grid-area:lune}
.panel-rig{grid-area:rig}
.panel-suivi{grid-area:suivi}
.panel-decodes{grid-area:decodes;min-height:220px}
.panel-title{font-family:var(--font-display);font-weight:900;letter-spacing:.25px;font-size:17px;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.panel-title svg{color:var(--accent2);flex-shrink:0}

/* ── Métriques (grille de chiffres) ────────────────────────────────────── */
.eme-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.eme-metric{background:var(--bg3);border-radius:8px;padding:10px 12px}
.eme-metric-label{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-bottom:4px}
.eme-metric-value{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text)}
.eme-metric-value.accent{color:var(--accent2)}

/* ── Point d'état (remplace 🟢🔴) ──────────────────────────────────────── */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.on{background:var(--green)}
.dot.off{background:var(--red)}

/* ── Fenêtre commune ────────────────────────────────────────────────────── */
.eme-window-list{margin-top:12px;font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.eme-window-row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)}
.eme-window-row:last-child{border-bottom:none}

/* ── Décodages ──────────────────────────────────────────────────────────── */
.eme-decode-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.eme-decode-row{width:100%;display:flex;align-items:center;gap:14px;background:var(--bg3);border-radius:6px;padding:7px 12px;font-family:var(--font-mono);font-size:13px}
.eme-decode-call{font-weight:700;color:var(--accent2);min-width:80px}
.eme-decode-msg{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eme-decode-snr{color:var(--muted)}
.eme-decode-age{color:var(--muted);font-size:11px}
.eme-decode-fallback{font-size:13px;line-height:1.7;color:var(--muted);background:var(--bg3);border-radius:8px;padding:14px 16px}
.eme-decode-fallback b{color:var(--text)}
.eme-decode-empty{color:var(--muted);font-size:13px;padding:8px 0}

/* ── Suivi Lune ─────────────────────────────────────────────────────────── */
.eme-track-status{font-family:var(--font-mono);font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.eme-track-actions{display:flex;gap:10px;margin:12px 0}
.eme-btn{font-family:var(--font-mono);font-size:12.5px;font-weight:700;letter-spacing:1.5px;padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;transition:all .15s}
.eme-btn:hover:not(:disabled){border-color:var(--accent2);color:var(--accent2)}
.eme-btn:disabled{opacity:.4;cursor:not-allowed}
.eme-btn.start{background:linear-gradient(135deg,#C9822E,#FF9500);border:none;color:#0A0B18}
.eme-btn.start:disabled{background:var(--bg3);color:var(--muted)}
.eme-track-msg{font-family:var(--font-mono);font-size:12.5px;color:var(--yellow);min-height:18px;margin-top:6px}
.eme-track-msg.err{color:var(--red)}

button:focus-visible,.eme-btn:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

@media (max-width:900px){
  .eme-grid{grid-template-columns:1fr;grid-template-areas:"lune" "rig" "suivi" "decodes"}
}
</style>

<script>
(function(){
  // Repli i18n : logx_i18n.js n'expose que window.rcT/window.rcTf (jamais de
  // globals T/Tf bruts) — même patron que logx_propagation.html/logx_websdr.html.
  const T  = s    => (window.rcT  ? window.rcT(s)     : s);
  const Tf = (s,p) => (window.rcTf ? window.rcTf(s, p) : (function(){
    let o = s; for(const k in (p || {})) o = o.split('{' + k + '}').join(p[k]); return o;
  })());
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Bandes EME connues, même libellés que logx_eme_bandplan.EME_ACTIVITE
  // (Python fait autorité sur rf_mhz/transverter ; ici uniquement l'affichage).
  const BANDES = [
    {id:'50', label:'6 m'}, {id:'144', label:'2 m'}, {id:'432', label:'70 cm'},
    {id:'1296', label:'23 cm'}, {id:'2320', label:'13 cm'}, {id:'3400', label:'9 cm'},
    {id:'5760', label:'6 cm'}, {id:'10368', label:'3 cm'}, {id:'24048', label:'1,2 cm'},
    {id:'47088', label:'6 mm'}
  ];

  const selBand = document.getElementById('emeBand');
  BANDES.forEach(b => {
    const o = document.createElement('option');
    o.value = b.id; o.textContent = b.label + ' (' + b.id + ' MHz)';
    selBand.appendChild(o);
  });

  let band  = localStorage.getItem('rc_eme_band') || '144';
  let dxloc = localStorage.getItem('rc_eme_dxlocator') || '';
  if (!BANDES.some(b => b.id === band)) band = '144';
  selBand.value = band;
  document.getElementById('emeDxLocator').value = dxloc;

  function metric(label, value, cls) {
    return '<div class="eme-metric"><div class="eme-metric-label">' + esc(label) +
      '</div><div class="eme-metric-value' + (cls ? ' ' + cls : '') + '">' + value + '</div></div>';
  }

  // ── LUNE ─────────────────────────────────────────────────────────────────
  function renderLune(d) {
    const box = document.getElementById('emeLuneMetrics');
    const m = d.moon;
    if (!m) {
      box.innerHTML = metric(T('POSITION'),
        esc(T("Position de la station inconnue — renseignez la grille (locator) dans CONFIGURATION.")));
      document.getElementById('emeWindowList').innerHTML = '';
      return;
    }
    if (m.error !== undefined && m.available === undefined) {
      box.innerHTML = metric(T('POSITION'), esc(m.error || T('Indisponible.')));
      document.getElementById('emeWindowList').innerHTML = '';
      return;
    }
    const rows = [];
    rows.push(metric(T('AZ / EL'), esc(m.az) + '° / ' + esc(m.alt) + '°'));
    rows.push(metric(T('DISTANCE'), esc(Math.round(m.distance_km).toLocaleString('fr-FR')) + ' km'));
    rows.push(metric(T('PHASE'), esc(m.phase_pct) + ' %'));
    rows.push('<div class="eme-metric"><div class="eme-metric-label">' + esc(T('VISIBLE')) +
      '</div><div class="eme-metric-value"><span class="dot ' + (m.visible ? 'on' : 'off') +
      '"></span> ' + (m.visible ? esc(T('Oui')) : esc(T('Non'))) + '</div></div>');
    rows.push(metric(T('DOPPLER'), esc(window.dopplerLabel(d.doppler_hz)), 'accent'));
    rows.push(metric(T('RF'), esc(d.rf_mhz) + ' MHz'));
    rows.push(metric(T('LEVER'), d.rise_utc ? esc(d.rise_utc) + ' UTC' : '—'));
    rows.push(metric(T('COUCHER'), d.set_utc ? esc(d.set_utc) + ' UTC' : '—'));
    box.innerHTML = rows.join('');

    const winBox = document.getElementById('emeWindowList');
    if (!dxloc) {
      winBox.innerHTML = '';
    } else if (!d.window || !d.window.length) {
      winBox.innerHTML = '<div class="eme-window-row">' +
        esc(Tf('Aucune fenêtre commune avec {loc} dans les 48 h qui viennent.', {loc: dxloc})) +
        '</div>';
    } else {
      winBox.innerHTML = '<div class="eme-window-row"><b>' +
        esc(Tf('Fenêtre commune avec {loc} :', {loc: dxloc})) + '</b></div>' +
        d.window.map(w => '<div class="eme-window-row">' + esc(w.start_utc) +
          ' → ' + esc(w.end_utc) + '</div>').join('');
    }
  }

  // ── RIG ──────────────────────────────────────────────────────────────────
  function renderRig(rig) {
    const box = document.getElementById('emeRigMetrics');
    if (!rig || rig.enabled === false) {
      box.innerHTML = metric(T('PONT WSJT-X'), esc(T('Désactivé — voir CONFIGURATION > numérique.')));
      return;
    }
    const on = !!rig.connected;
    box.innerHTML =
      '<div class="eme-metric"><div class="eme-metric-label">' + esc(T('ÉTAT')) +
      '</div><div class="eme-metric-value"><span class="dot ' + (on ? 'on' : 'off') +
      '"></span> ' + (on ? esc(T('Connecté')) : esc(T('En attente de WSJT-X…'))) + '</div></div>' +
      metric(T('CADRAN'), rig.dial_mhz ? esc(rig.dial_mhz) + ' MHz' : '—') +
      metric(T('MODE'), esc(rig.mode) || '—');
  }

  // ── DÉCODAGES ────────────────────────────────────────────────────────────
  function ageLabel(lastSeen) {
    if (!lastSeen) return '—';
    const s = Math.max(0, Math.round(Date.now() / 1000 - lastSeen));
    return s < 60 ? (s + ' s') : (Math.round(s / 60) + ' min');
  }

  function renderDecodes(decodes, rig) {
    const box = document.getElementById('emeDecodesBody');
    if (!rig || !rig.connected) {
      box.innerHTML = '<div class="eme-decode-fallback">' +
        esc(T('Aucun décodage : WSJT-X n\'est pas relié à LogX AI.')) + '<br><br>' +
        '<b>' + esc(T('Marche à suivre')) + '</b> — ' +
        esc(T('WSJT-X → Réglages → Rapports → serveur UDP = ce PC, port 2237, mode Q65 ou JT65.')) +
        '</div>';
      return;
    }
    if (!decodes || !decodes.length) {
      box.innerHTML = '<div class="eme-decode-empty">' + esc(T('Aucune station entendue pour le moment.')) + '</div>';
      return;
    }
    box.innerHTML = decodes.map(dd => {
      const compact = window.formatDecode(dd);
      return '<div class="eme-decode-row"><span class="eme-decode-call">' + esc(dd.call) +
        '</span><span class="eme-decode-msg" title="' + esc(dd.message || compact) + '">' +
        esc(dd.message || compact) + '</span><span class="eme-decode-snr">' +
        esc((dd.snr >= 0 ? '+' : '') + dd.snr + ' dB') + '</span><span class="eme-decode-age">' +
        esc(ageLabel(dd.last_seen)) + '</span></div>';
    }).join('');
  }

  // ── TRANSVERTER ──────────────────────────────────────────────────────────
  function renderTransverter(actif) {
    const banner = document.getElementById('emeTransverterBanner');
    if (actif) {
      document.getElementById('emeTransverterMsg').textContent =
        T('Bande à transverter : le cadran du CAT affiche la fréquence intermédiaire (FI), pas la RF réelle.');
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  // ── SUIVI LUNE ───────────────────────────────────────────────────────────
  function renderTrack(track) {
    track = track || {};
    const dot = document.getElementById('emeTrackDot');
    const actif = !!track.actif;
    dot.className = 'dot ' + (actif ? 'on' : 'off');
    document.getElementById('emeTrackText').textContent =
      track.note || track.phase || (actif ? T('Suivi actif') : T('Suivi arrêté'));

    const box = document.getElementById('emeTrackMetrics');
    const rows = [];
    if (track.cible_az !== null && track.cible_az !== undefined) {
      rows.push(metric(T('CIBLE'), esc(track.cible_az) + '° / ' + esc(track.cible_el) + '°'));
    }
    if (track.rotor_az !== null && track.rotor_az !== undefined) {
      rows.push(metric(T('ROTOR'), esc(track.rotor_az) + '° / ' + esc(track.rotor_el) + '°'));
    }
    if (track.envois) rows.push(metric(T('ENVOIS'), esc(track.envois)));
    box.innerHTML = rows.join('');

    document.getElementById('emeTrackStart').disabled = actif;
    document.getElementById('emeTrackStop').disabled = !actif;
  }

  // ── Polling ──────────────────────────────────────────────────────────────
  async function poll() {
    try {
      const url = '/eme/cockpit?band=' + encodeURIComponent(band) + '&dx_locator=' + encodeURIComponent(dxloc);
      const r = await fetch(url);
      const d = await r.json();
      renderLune(d);
      renderRig(d.rig);
      renderDecodes(d.decodes || [], d.rig);
      renderTransverter(!!d.transverter);
      renderTrack(d.track);
    } catch (e) {
      // Silencieux : le prochain poll (3 s) réessaiera. Ne pas alerter à
      // chaque coupure réseau transitoire.
    }
  }

  selBand.onchange = function () {
    band = this.value;
    localStorage.setItem('rc_eme_band', band);
    poll();
  };
  const inLoc = document.getElementById('emeDxLocator');
  inLoc.onchange = function () {
    dxloc = this.value.trim().toUpperCase();
    localStorage.setItem('rc_eme_dxlocator', dxloc);
    poll();
  };

  function showTrackMsg(msg, isErr) {
    const el = document.getElementById('emeTrackMsg');
    el.textContent = msg || '';
    el.classList.toggle('err', !!isErr);
  }

  async function postTrack(action) {
    try {
      const r = await fetch('/moon/track/' + action, {method: 'POST'});
      const d = await r.json();
      showTrackMsg(d.message || '', !d.ok);
      poll();
    } catch (e) {
      showTrackMsg(T('Requête impossible — le serveur ne répond pas.'), true);
    }
  }
  document.getElementById('emeTrackStart').onclick = () => postTrack('start');
  document.getElementById('emeTrackStop').onclick = () => postTrack('stop');

  poll();
  setInterval(poll, 3000);
})();
</script>

</body>
</html>
