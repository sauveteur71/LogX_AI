<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogX AI — Panneau détaché</title>
<link rel="icon" href="/logx_icon.svg">
<style>
:root{--bg:#05060C;--bg2:#0C0E1A;--bg3:#14172C;--border:#242844;
  --accent:#FF5030;--accent2:#00D4FF;--green:#00FF88;--yellow:#FFD60A;
  --red:#FF2D55;--purple:#BF5AF2;--text:#EDF0FA;--muted:#8792B5;
  --mono:'Share Tech Mono',monospace;}
body.day-mode{--bg:#EEF0F8;--bg2:#FFFFFF;--bg3:#E0E4F4;--border:#C0C8E0;
  --accent:#CC4026;--accent2:#0060A0;--green:#007030;--yellow:#7A5A00;
  --red:#CC0030;--purple:#8040B0;--text:#0A0C20;--muted:#4A5170;}
body.day-mode header{background:linear-gradient(90deg,#DDE0EE,#EAEDF8,#DDE0EE)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:9px 16px;background:linear-gradient(90deg,#080A16,#12152C,#080A16);border-bottom:2px solid var(--border);flex-shrink:0}
.title{font-size:16px;font-weight:800;color:var(--accent);letter-spacing:1px}
.clock{margin-left:auto;font-size:14px;color:var(--muted)}
.wrap{flex:1;overflow-y:auto;padding:12px 16px}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:baseline;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.row .call{font-weight:800;letter-spacing:.5px}
.row .muted{color:var(--muted)}
.row .info{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mult{color:var(--green);font-weight:700}
.done{opacity:.4;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.item .lbl{font-size:10px;color:var(--muted);letter-spacing:1px}
.item .val{font-size:18px;font-weight:800;margin-top:2px}
.hint{padding:6px 4px;font-size:13px;border-left:3px solid var(--accent2);margin-bottom:5px;background:rgba(0,212,255,.06)}
.band-plan{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.band-chip{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:12px}
.band-chip.best{border-color:var(--green);color:var(--green)}
.band-chip.closed{opacity:.4}
</style>
</head>
<body>
<header>
  <div class="title" id="panelTitle">—</div>
  <div class="clock" id="clock">—</div>
</header>
<div class="wrap" id="panelBody">Chargement…</div>
<script>
// Migration localStorage 'radiocontest_' -> 'logx_' (renommage du produit), idempotente.
(function(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('radiocontest_')===0){const nk='logx_'+k.slice(13);if(localStorage.getItem(nk)===null)localStorage.setItem(nk,localStorage.getItem(k));}}}catch(e){}})();
// Thème jour/nuit : cette fenêtre détachée doit suivre le réglage de la page
// principale (localStorage partagé, même origine). Si ouverte directement sur
// un AUTRE poste (écran mural sur un 2e PC/projecteur), aucun rc_theme local
// encore choisi : hériter du dernier thème connu du serveur plutôt que de
// retomber en mode nuit par défaut.
if(localStorage.getItem('rc_theme') === 'day') document.body.classList.add('day-mode');
if(localStorage.getItem('rc_theme') === null){
  fetch('/config').then(r=>r.ok?r.json():null).then(c=>{
    if(c && c.ui_theme && localStorage.getItem('rc_theme') === null){
      localStorage.setItem('rc_theme', c.ui_theme);
      document.body.classList.toggle('day-mode', c.ui_theme === 'day');
    }
  }).catch(()=>{});
}
(function(){
  if(location.protocol==='file:'){ document.body.innerHTML='<div class="empty">Ouvre via le serveur : http://127.0.0.1:8080/logx_panel.html</div>'; return; }
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || '';

  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  // ─── COACH ──────────────────────────────────────────────────────────────
  async function tickCoach(){
    const body = document.getElementById('panelBody');
    try{
      const r = await fetch('/coach/state');
      if(!r.ok) return;
      const d = await r.json();
      const c = d.clock || {}, s = d.stats || {};
      let clockTxt = '—';
      if(c.status === 'en_cours'){
        const h = Math.floor(c.remaining_h || 0), m = Math.round(((c.remaining_h || 0) - h) * 60);
        clockTxt = `⏱ reste ${h}h${String(m).padStart(2,'0')} (${c.pct_done || 0}%)`;
      } else if(c.status === 'avant') clockTxt = `⏳ départ dans ${c.starts_in_h} h`;
      else if(c.status === 'termine') clockTxt = '🏁 terminé';

      let rate = '';
      if(c.status === 'en_cours'){
        rate = `<b>${s.qso_last_hour||0}</b> QSO dernière heure`;
        if(s.rate_avg != null) rate += ` · moyenne <b>${s.rate_avg}</b>/h`;
        rate += ` · total <b>${s.qso_total||0}</b> QSO`;
      }

      const bands = (d.band_plan || []).slice(0,6).map((b,i) =>
        `<span class="band-chip ${i===0&&b.open?'best':''} ${b.open?'':'closed'}" title="${esc(b.reason||'')}">${esc(b.band)}${b.weight>1?' ×'+b.weight:''}</span>`).join('');

      let hints = '';
      if(d.run_sp){
        hints += `<div class="hint" style="border-color:${d.run_sp.mode==='RUN'?'var(--green)':'var(--accent2)'}"><b>${d.run_sp.mode==='CHANGE'?'CHANGE DE BANDE':d.run_sp.mode}</b> — ${esc(d.run_sp.reason||'')}</div>`;
      }
      hints += (d.hints || []).slice(0,4).map(h => `<div class="hint">${esc(h.icon||'')} ${esc(h.text||'')}</div>`).join('');

      body.innerHTML = `<div style="margin-bottom:10px">${clockTxt}</div><div style="margin-bottom:10px">${rate}</div>`
        + `<div class="band-plan">${bands}</div>${hints || '<div class="empty">Pas de conseil pour l\'instant</div>'}`;
    }catch(e){ /* serveur injoignable : contenu inchangé */ }
  }

  // ─── CLUSTER — NEED LIST (lecture seule, sans QSY/rotor pour rester simple) ─
  async function tickCluster(){
    const body = document.getElementById('panelBody');
    try{
      const r = await fetch('/data/spots_ranked');
      if(!r.ok) return;
      const d = await r.json();
      const spots = (d.spots || []).slice(0, 40);
      // Sans concours sélectionné, le barème retombe sur 1 pt/km : le tri
      // reste bon mais le chiffre ne compte pour rien — on ne l'affiche pas.
      const contestActif = !!((d.meta || {}).contest_actif);
      if(!spots.length){ body.innerHTML = '<div class="empty">Aucun spot exploitable</div>'; return; }
      body.innerHTML = spots.map(s => `
        <div class="row">
          <span class="call ${s.already_done?'done':''}">${s.new_mult&&!s.already_done?'★ ':''}${esc(s.call)}</span>
          <span class="muted">${esc(s.freq||'')}</span>
          <span class="muted">${esc(s.band)} MHz</span>
          <span class="${s.new_mult&&!s.already_done?'mult':''}">${s.already_done?'déjà fait':(contestActif?'+' + (s.value||s.points||0) + ' pts':'nouveau')}</span>
          <span class="info" title="${contestActif?esc(s.explanation||''):''}">${esc(s.info || s.spotter || '')}</span>
        </div>`).join('');
    }catch(e){ /* serveur injoignable */ }
  }

  // ─── SOLEIL & IONOSPHÈRE ────────────────────────────────────────────────
  async function tickSolarWeather(){
    const body = document.getElementById('panelBody');
    try{
      const r = await fetch('/data/propagation');
      if(!r.ok) return;
      const d = await r.json();
      const s = d.solar || {};
      const items = [
        ['SFI', s.sfi, s.sfi>=120?'var(--green)':s.sfi>=90?'var(--yellow)':'var(--red)'],
        ['INDEX K', s.k_index, s.k_index<=2?'var(--green)':s.k_index<=4?'var(--yellow)':'var(--red)'],
        ['INDEX A', s.a_index, s.a_index<=15?'var(--green)':'var(--yellow)'],
        ['TACHES', s.sunspots, 'var(--text)'],
        ['RAYONS X', s.xray, 'var(--text)'],
        ['AURORE', s.aurora, 'var(--text)'],
      ];
      const grid = items.map(([l,v,col]) => `<div class="item"><div class="lbl">${l}</div><div class="val" style="color:${col}">${v??'—'}</div></div>`).join('');
      const muf = d.muf && d.muf.muf;
      body.innerHTML = `<div class="grid">${grid}</div>`
        + `<div style="margin-top:6px">MUF : <b style="color:var(--accent2)">${muf ? muf+' MHz' : '—'}</b>`
        + (d.muf ? ` <span class="muted">(ionosonde ${esc(d.muf.station)})</span>` : '') + '</div>';
    }catch(e){ /* serveur injoignable */ }
  }

  // ─── BAND MAP ───────────────────────────────────────────────────────────
  async function tickBandMap(){
    const body = document.getElementById('panelBody');
    const band = params.get('band') || '144';
    try{
      const r = await fetch('/data/spots_ranked');
      if(!r.ok) return;
      const d = await r.json();
      const spots = (d.spots || []).filter(s => String(s.band) === band)
        .sort((a,b) => parseFloat(b.freq||0) - parseFloat(a.freq||0));
      if(!spots.length){ body.innerHTML = `<div class="empty">Aucun spot sur ${esc(band)} MHz</div>`; return; }
      body.innerHTML = spots.map(s => `
        <div class="row">
          <span class="call ${s.already_done?'done':''}">${s.new_mult&&!s.already_done?'★ ':''}${esc(s.call)}</span>
          <span class="info">${esc(s.freq||'')}</span>
        </div>`).join('');
    }catch(e){ /* serveur injoignable */ }
  }

  // ─── WORKED MATRIX (grille bande × CW/Phone/Digital) ────────────────────
  // Vie entière (carnet permanent, comme le popup Diplômes) par défaut ; ou
  // scopée au concours actuellement configuré (?scope=contest côté serveur) —
  // utile pendant l'épreuve pour voir d'un coup d'œil quelles cases restent
  // à couvrir DANS ce concours précis, plutôt que le total historique.
  let _wmScope = 'life';
  async function tickWorkedMatrix(){
    const body = document.getElementById('panelBody');
    const toggle = `<div style="display:flex;gap:6px;margin-bottom:10px">
      <button data-wm="life" style="flex:1;font-family:inherit;font-size:12px;padding:5px;cursor:pointer;
        background:${_wmScope==='life'?'var(--accent2)':'var(--bg3)'};color:${_wmScope==='life'?'#04121a':'var(--text)'};
        border:1px solid var(--border);border-radius:6px">🗂 Vie entière</button>
      <button data-wm="contest" style="flex:1;font-family:inherit;font-size:12px;padding:5px;cursor:pointer;
        background:${_wmScope==='contest'?'var(--accent2)':'var(--bg3)'};color:${_wmScope==='contest'?'#04121a':'var(--text)'};
        border:1px solid var(--border);border-radius:6px">🏁 Ce concours</button>
    </div>`;
    try{
      const url = _wmScope === 'contest' ? '/awards/matrix?scope=contest' : '/awards/matrix';
      const r = await fetch(url);
      if(!r.ok) return;
      const m = await r.json();
      if(!m || !m.bands || !m.bands.length){
        body.innerHTML = toggle + '<div class="empty">'
          + (_wmScope==='contest' ? 'Aucun QSO dans le concours actif pour l\'instant.' : 'Pas encore de QSO.')
          + '</div>';
        return;
      }
      const catIcon = {CW:'📟', PHONE:'🎙️', DIGITAL:'💻'};
      const cell = (c) => {
        if(!c || !c.qso) return `<td style="text-align:center;padding:4px 8px;color:var(--muted)">—</td>`;
        const conf = c.confirmed ? ` <span style="color:var(--green)">(${c.confirmed})</span>` : '';
        return `<td style="text-align:center;padding:4px 8px;background:rgba(0,212,255,.08)"><b>${c.qso}</b>${conf}</td>`;
      };
      const rows = m.bands.map(b => {
        const g = m.grid[b] || {};
        return `<tr><td style="padding:4px 8px;color:var(--muted)">${esc(b)} MHz</td>`
          + m.categories.map(c => cell(g[c])).join('') + `</tr>`;
      }).join('');
      const totalsRow = `<tr style="border-top:1px solid var(--border)"><td style="padding:4px 8px;color:var(--muted)">Total</td>`
        + m.categories.map(c => `<td style="text-align:center;padding:4px 8px"><b>${(m.totals&&m.totals[c])||0}</b></td>`).join('') + `</tr>`;
      body.innerHTML = toggle + `<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px">
        <thead><tr><td></td>${m.categories.map(c=>`<td style="text-align:center;padding:4px 8px;color:var(--accent2)">${catIcon[c]||''} ${esc(c)}</td>`).join('')}</tr></thead>
        <tbody>${rows}${totalsRow}</tbody>
        </table>
        <div style="font-size:11px;color:var(--muted);margin-top:8px">QSO travaillés · (confirmés) en vert</div>`;
    }catch(e){ /* serveur injoignable : contenu inchangé */ }
  }
  document.addEventListener('click', function(e){
    const btn = e.target.closest('[data-wm]');
    if(!btn) return;
    _wmScope = btn.getAttribute('data-wm');
    tickWorkedMatrix();
  });

  const PANELS = {
    coach:        {title: '🧠 COACH', pollMs: 15000, tick: tickCoach},
    cluster:      {title: '📡 CLUSTER — NEED LIST', pollMs: 20000, tick: tickCluster},
    solarweather: {title: '☀️ SOLEIL & IONOSPHÈRE', pollMs: 5*60*1000, tick: tickSolarWeather},
    bandmap:      {title: '📶 BAND MAP', pollMs: 15000, tick: tickBandMap},
    workedmatrix: {title: '🧮 WORKED MATRIX', pollMs: 30000, tick: tickWorkedMatrix},
  };

  function boot(){
    const p = PANELS[id];
    const body = document.getElementById('panelBody');
    if(!p){ body.innerHTML = '<div class="empty">Panneau inconnu : ' + esc(id) + '</div>'; return; }
    document.title = 'LogX AI — ' + p.title;
    document.getElementById('panelTitle').textContent = p.title;
    setInterval(() => {
      const n = new Date();
      const localStr = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
      document.getElementById('clock').textContent = n.toISOString().slice(11,19) + ' UTC · ' + localStr + ' local';
    }, 1000);
    p.tick();
    setInterval(p.tick, p.pollMs);
  }
  boot();
})();
</script>
</body>
</html>
