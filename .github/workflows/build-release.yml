name: Build multi-OS (release)

# Construit les executables Windows / macOS / Linux et les attache a la
# release GitHub du tag pousse. Se declenche sur tout tag v* (ex. v0.9-beta2)
# ou a la main (workflow_dispatch, en donnant le nom du tag).
#
# PyInstaller ne cross-compile pas : chaque OS construit le sien sur son
# propre runner — c'est precisement ce que ce workflow automatise (pas
# besoin de posseder un Mac ni une machine Linux).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release a completer (ex. v0.9-beta1)'
        required: true

permissions:
  contents: write   # necessaire pour attacher les fichiers a la release

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            source: dist/LogXAI.exe
            suffix: ''
            ext: '.exe'
          - os: macos-latest
            label: macOS
            source: dist/LogXAI
            suffix: '-macos'
            ext: ''
          - os: ubuntu-latest
            label: Linux
            source: dist/LogXAI
            suffix: '-linux'
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependances systeme (Linux - PortAudio pour sounddevice)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Dependances Python
        working-directory: concours
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Construction PyInstaller
        working-directory: concours
        run: python -m PyInstaller --noconfirm --clean logx.spec

      # Resolu une seule fois, meme repli que l'etape d'attachement ci-dessous :
      # github.ref_name est le tag pousse (push tag v*), mais vaudrait le nom
      # de la branche en workflow_dispatch — d'ou l'input tag en repli.
      #
      # TAG_INPUT passe par env: plutot que par une interpolation ${{ }}
      # directe dans le script bash : github.event.inputs.tag est un texte
      # libre saisi a la main (workflow_dispatch, aucune validation de
      # format), et l'injecter tel quel dans `run:` permettrait a une
      # valeur du genre `$(curl ... | sh)` de s'executer sur le runner
      # (injection de script GitHub Actions, classe de faille connue —
      # https://docs.github.com/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections).
      # Une fois dans $TAG_INPUT, le shell la traite comme une simple valeur.
      - name: Determiner le tag de version
        id: version
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"

      # Nomme l'artefact avec le tag (LogXAI-v0.9-beta2.exe, -macos, -linux) :
      # sans ca, un testeur avec plusieurs versions dans son dossier
      # Telechargements ne peut plus distinguer laquelle est laquelle (l'exe
      # Windows produit par PyInstaller s'appelle toujours LogXAI.exe).
      #
      # Meme raison que l'etape precedente : TAG reste la meme valeur non
      # validee (juste passee par steps.version entre-temps), donc pas
      # d'interpolation ${{ }} directe dans `run:` ici non plus — tout
      # transite par env:, y compris matrix.suffix/ext/source (statiques,
      # mais un seul pattern coherent pour toute l'etape).
      - name: Renommer l'artefact avec le tag de version
        id: artefact
        working-directory: concours
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SUFFIX: ${{ matrix.suffix }}
          EXT: ${{ matrix.ext }}
          SRC: ${{ matrix.source }}
        run: |
          name="LogXAI-${TAG}${SUFFIX}${EXT}"
          mv "$SRC" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attacher a la release du tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: concours/dist/${{ steps.artefact.outputs.name }}
