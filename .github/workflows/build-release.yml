name: Build multi-OS (release)

# Construit les executables Windows / macOS / Linux et les attache a la
# release GitHub du tag pousse. Se declenche sur tout tag v* (ex. v0.9-beta2)
# ou a la main (workflow_dispatch, en donnant le nom du tag).
#
# PyInstaller ne cross-compile pas : chaque OS construit le sien sur son
# propre runner — c'est precisement ce que ce workflow automatise (pas
# besoin de posseder un Mac ni une machine Linux).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release a completer (ex. v0.9-beta1)'
        required: true

permissions:
  contents: write   # necessaire pour attacher les fichiers a la release

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artefact: LogXAI.exe
            source: dist/LogXAI.exe
          - os: macos-latest
            label: macOS
            artefact: LogXAI-macos
            source: dist/LogXAI
          - os: ubuntu-latest
            label: Linux
            artefact: LogXAI-linux
            source: dist/LogXAI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependances systeme (Linux - PortAudio pour sounddevice)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Dependances Python
        working-directory: concours
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Construction PyInstaller
        working-directory: concours
        run: python -m PyInstaller --noconfirm --clean logx.spec

      - name: Renommer l'artefact
        if: matrix.artefact != 'LogXAI.exe'
        working-directory: concours
        run: mv "${{ matrix.source }}" "dist/${{ matrix.artefact }}"
        shell: bash

      - name: Attacher a la release du tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: concours/dist/${{ matrix.artefact }}
