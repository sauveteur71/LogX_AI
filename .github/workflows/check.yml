name: Check LogX AI

on:
  # concours/** couvre le code + les tests. Les deux entrees .github/
  # ci-dessous sont necessaires en plus : tests/test_release_ci_config.py
  # valide bug.yml/config.yml/build-release.yml, mais vit sous concours/ —
  # un commit qui ne touche QUE ces fichiers .github/ (sans rien changer
  # sous concours/) ne declenchait donc jamais ce filet de non-regression
  # (revue commit 8194b55).
  push:
    paths:
      - 'concours/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/build-release.yml'
  pull_request:
    paths:
      - 'concours/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch: {}

jobs:
  validate:
    name: Tests + validation schema + harnais mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Plusieurs tests de non-regression font "git show <ancien-hash>:fichier"
          # pour prouver qu'un bug se reproduisait sur le commit d'avant son
          # correctif (ex. tests/test_rph_weekend_fallback.py). Le clone
          # superficiel par defaut (depth=1) ne contient QUE le dernier commit :
          # ces anciens hashes n'existent alors pas dans l'objet git du runner,
          # d'ou un echec systematique (exit 128) sans rapport avec le code
          # teste lui-meme. Historique complet necessaire.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install -r concours/requirements.txt

      - name: Lancer la suite de tests (pytest)
        working-directory: concours
        run: python -m pytest -q

      - name: Lint Python (ruff)
        # Portee volontairement minimale (E9 = erreurs de syntaxe, F =
        # pyflakes) -- voir concours/ruff.toml pour le detail et le
        # raisonnement. Bloquant : le depot est propre sur ce socle
        # depuis le 10/08/2026, une regression doit casser la CI.
        working-directory: concours
        run: ruff check .

      - name: Valider les definitions de concours
        working-directory: concours
        run: python logx_validate.py

      - name: Tester le harnais d'extraction (mode mock, sans appel IA)
        # Informatif seulement : le mock est volontairement imparfait
        # (score jamais 100%), ce test verifie juste l'absence de crash.
        continue-on-error: true
        working-directory: concours
        run: python logx_eval.py --mock

  eval-ia:
    name: Eval extraction IA reelle (corpus complet)
    # Ne tourne que si la cle API est configuree dans les secrets du repo
    # (Settings -> Secrets and variables -> Actions -> ANTHROPIC_API_KEY)
    # ET que la variable de repo ENABLE_AI_EVAL vaut "true".
    # Optionnel : consomme des appels API reels, pas bloquant pour le build.
    if: ${{ vars.ENABLE_AI_EVAL == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install -r concours/requirements.txt

      - name: Lancer le corpus d'evaluation complet
        working-directory: concours
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python logx_eval.py
