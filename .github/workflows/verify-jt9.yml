name: Vérifier jt9 embarqué

# Vérifie, sur CHAQUE OS cible (Windows/macOS/Linux), que le binaire jt9
# récupéré par l'action fetch-jt9 décode réellement l'échantillon EME de
# référence (tests/fixtures/q65_60A_eme_6m.wav → 3 stations attendues).
#
# C'est le TÉMOIN VERT SUR LA PLATEFORME CIBLE de l'embarquement jt9 : la
# seule preuve valable que le fetch + les dépendances runtime fonctionnent.
# Ne construit PAS l'exécutable PyInstaller (itération rapide sur la partie
# dure). Déclenchement manuel — on ne télécharge pas WSJT-X à chaque push.

on:
  workflow_dispatch:
  # Déclenché automatiquement sur les PR qui touchent la machinerie jt9 (et
  # seulement celles-là : le fetch télécharge WSJT-X, coûteux — on ne le paie
  # que quand c'est pertinent). Garde-fou permanent : preuve 3-OS que le
  # binaire embarqué décode toujours après une modif du natif ou du fetch.
  pull_request:
    paths:
      - 'concours/logx_q65_natif.py'
      - 'concours/logx.spec'
      - 'concours/tests/test_q65_natif.py'
      - '.github/actions/fetch-jt9/**'
      - '.github/workflows/verify-jt9.yml'

permissions:
  contents: read

jobs:
  verify:
    name: jt9 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer jt9
        uses: ./.github/actions/fetch-jt9

      # SONDE (temporaire) : lance jt9 en direct et montre stdout + STDERR +
      # exit, que decoder_wav masque. Ne fait pas échouer le job.
      - name: Diagnostic jt9 (stdout/stderr/exit)
        working-directory: concours
        shell: bash
        run: |
          set +e
          jt9dir="$PWD/vendor/jt9"
          abin="$jt9dir/jt9"; [ -f "$jt9dir/jt9.exe" ] && abin="$jt9dir/jt9.exe"
          echo "=== binaire : $abin ==="
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LD_LIBRARY_PATH="$jt9dir:$LD_LIBRARY_PATH"
            echo "--- ldd ---"; ldd "$abin"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$jt9dir:$DYLD_LIBRARY_PATH"
            echo "--- otool -L ---"; otool -L "$abin"
          fi
          tmp="$(mktemp -d)"
          cp tests/fixtures/q65_60A_eme_6m.wav "$tmp/x.wav"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "macOS : jt9 pas encore exécutable (Qt) — sweep sauté ce tour"
            exit 0
          fi
          # Balayage de flags : vanilla jt9 décode 0 au défaut (-d 1) là où
          # l'Improved décode 3. On cherche la profondeur/plage qui sort les
          # stations EME faibles du fixture.
          for flags in "-3 -p 60 -b A" "-3 -p 60 -b A -d 2" "-3 -p 60 -b A -d 3" "-3 -p 60 -b A -d 3 -H 5000 -F 200"; do
            echo "### flags: $flags"
            ( cd "$tmp" && "$abin" $flags -a "$tmp" "$tmp/x.wav" ) 2>&1
            echo "--- (exit=$?) ---"
          done

      - name: Décodage du fixture EME (test d'intégration)
        working-directory: concours
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_q65_natif.py -v
